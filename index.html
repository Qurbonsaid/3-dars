<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamonaviy Kalkulyator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #121214;
        }
        .calculator {
            width: 320px;
            background-color: #1e1e24;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        #display {
            width: 100%;
            height: 80px;
            background: none;
            border: none;
            color: #ffffff;
            text-align: right;
            font-size: 2.5rem;
            margin-bottom: 20px;
            padding: 0 10px;
            outline: none;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            padding: 20px;
            font-size: 1.25rem;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            background-color: #2a2a32;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        button:active {
            transform: scale(0.95);
            background-color: #3a3a45;
        }
        .operator {
            background-color: #ff9f0a;
            color: #ffffff;
        }
        .operator:active {
            background-color: #cc7f08;
        }
        .clear {
            background-color: #a5a5a5;
            color: #000000;
        }
        .clear:active {
            background-color: #8e8e8e;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" readonly value="0">
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="clear" onclick="backspace()">⌫</button>
        <button class="operator" onclick="appendValue('%')">%</button>
        <button class="operator" onclick="appendValue('/')">/</button>
        
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('*')">*</button>
        
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('-')">-</button>
        
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="operator" onclick="appendValue('+')">+</button>
        
        <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="operator" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function appendValue(val) {
        if (display.value === '0' && !isNaN(val)) {
            display.value = val;
        } else {
            display.value += val;
        }
    }

    function clearDisplay() {
        display.value = '0';
    }

    function backspace() {
        if (display.value.length > 1) {
            display.value = display.value.slice(0, -1);
        } else {
            display.value = '0';
        }
    }

    function calculate() {
        try {
            // Sonlarning boshidagi ortiqcha nollarni (masalan: 00101 -> 101) tozalash
            // Bu JavaScript-ni uni sakkizlik son deb o'ylashidan himoya qiladi
            let expression = display.value.replace(/\b0+(\d+)/g, '$1');
            
            // Xavfsiz hisoblash
            let result = new Function('return ' + expression)();
            
            display.value = result;
        } catch (error) {
            display.value = 'Xatolik';
        }
    }
</script>

</body>
</html>
